<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <div class="max-w-xl mx-auto my-8 border rounded shadow-lg overflow-hidden">
        <div class="bg-gradient-to-r from-indigo-500 to-teal-400 text-white flex justify-center items-center h-20 sm:h-28 lg:bg-green-500" >
            <h1 class=" text-2xl sm:text-4xl font-bold ">TAILWIND CSS</h1>
        </div>
        <div class="p-4 sm:p-6 text-center">
            <h2 class="m-2 text-lg sm:text-xl font-semibold">Hello, My name is Madhav Bharadwaj.</h2>
            <p class="text-sm sm:text-base text-gray-700">I am a web developer, and I love creating Responsive and Dynamic websites.</p>
            <form class="mt-4">
                <div class="flex flex-col sm:flex-row sm:items-center gap-2">
                    <input type="text" placeholder="Enter Your Name" id="name" class="flex-1 p-2 bg-slate-200 rounded">
                  </div>
                  <button class="mt-4 bg-blue-500 mx-auto text-white p-2 rounded w-30 sm:w-full" id="submitbtn">Submit</button>
            </form>
            <p class="mt-3 font-semibold" id="submittext">Thank you for your submission!</p>
        </div>
    </div>

    <script>
        const nameInput = document.getElementById('name');
        const submitBtn = document.getElementById('submitbtn');
        const submitText = document.getElementById('submittext');
        submitText.style.display = 'none'; 
        submitBtn.addEventListener('click', function(event) {
            event.preventDefault(); 
            
            submitText.textContent = "Thank you for your submission!";
            submitText.classList.add('text-green-500'); 
          
        });
    </script>
</body>
</html>
